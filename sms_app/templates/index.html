{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sms-app</title>
    <link rel="stylesheet" href="{%static '/css/style.css' %}">
</head>

<body>
    <h1>Student List</h1>

    <table border="1">
            <tr>
                <th>Name</th>
                <th>Roll</th>
                <th>Department</th>
                <th>Actions</th>
            </tr>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.roll }}</td>
                <td>{{ student.department }}</td>
                <td><a href="{% url 'edit_student' student.roll%}">Edit</a> <a href="{% url 'delete_student' student.roll%}">Delete</a></td>
            </tr>
            {% endfor %}
        
    </table><br><br>

    <button><a href="{% url 'add_student' %}">Add Student</a></button>

</body>

</html>
